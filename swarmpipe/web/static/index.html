<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmPipe - agentic data pipeline</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">SwarmPipe <span class="sub">multi-agent data pipeline</span></div>
  <nav id="tabs"></nav>

    <label>acting as <select id="user"><option>oncall</option><option>admin</option><option>analyst</option></select></label>
