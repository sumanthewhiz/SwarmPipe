[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmpipe"
version = "0.1.0"
description = "A hands-on, production-grade multi-agent data pipeline for learning agentic systems end to end."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pydantic>=2.6",
  "PyYAML>=6",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlwt>=1.3", "httpx>=0.27"]

[project.scripts]
swarmpipe = "swarmpipe.cli:app"

[tool.setuptools.packages.find]
include = ["swarmpipe*"]

[tool.setuptools.package-data]
swarmpipe = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
